<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HireCore</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 80%;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #222;
        }
        h1 {
            margin-bottom: 0.25rem;
        }
        .encabezado {
            color: #555;
            margin-top: 0;
        }
        .menu {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .panel {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }
        .panel:empty {
            display: none;
        }
        .panel h3 {
            width: 100%;
            margin: 0 0 0.5rem 0;
        }
        .fichas {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .fichas li {
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
        }
        .fichas li p {
            margin: 0 0 0.25rem 0;
        }
        .etapa-path {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            list-style: none;
            padding: 0;
            margin: 0.25rem 0 0 0;
        }
        .etapa-paso {
            display: flex;
            align-items: center;
        }
        .etapa-paso:not(:last-child)::after {
            content: "→";
            margin: 0 0.35rem;
            color: #aaa;
        }
        .etapa-pill {
            padding: 0.15rem 0.55rem;
            border-radius: 999px;
            font-size: 0.72rem;
            white-space: nowrap;
        }
        .etapa-hecha {
            background: #2e7d32;
            color: #fff;
        }
        .etapa-actual {
            background: #fff;
            color: #1b5e20;
            border: 2px solid #2e7d32;
            font-weight: 600;
        }
        .etapa-pendiente {
            background: #e0e0e0;
            color: #595959;
        }
        .etapa-descartada {
            background: #eee;
            color: #595959;
            text-decoration: line-through;
        }
        .etapa-rechazada {
            background: #c62828;
            color: #fff;
        }
        .registro {
            background: #111;
            color: #0f0;
            padding: 0.75rem;
            border-radius: 6px;
            height: 10rem;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="./dist/Main.js"></script>
</body>
</html>
